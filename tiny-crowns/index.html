<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tiny Crowns</title>
<style>
:root { color-scheme: light; --ink: #241d19; --terra: rgb(164, 88, 52); --line: #e3d8c8; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf7f0; color: var(--ink);
  font: 17px/1.5 Georgia, "Times New Roman", serif; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
form { width: min(340px, 100%); display: flex; flex-direction: column; gap: 12px; text-align: center; }
h1 { font-weight: 400; font-size: 34px; margin: 0 0 6px; letter-spacing: .01em; }
h1 span { color: var(--terra); }
input, button { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); }
input { background: #fff; color: var(--ink); }
button { background: var(--terra); color: #fbf1e2; border-color: var(--terra); cursor: pointer; }
button[disabled] { opacity: .6; }
p { margin: 0; min-height: 1.5em; font-size: 15px; color: #8a4a2e; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1><span>Tiny</span> Crowns</h1>
  <input id="p" type="password" placeholder="Passwort" aria-label="Passwort" autofocus>
  <button id="b">Öffnen</button>
  <p id="m" role="status"></p>
</form>
<script>
(function () {
  var salt = Uint8Array.from(atob("BhziGhvGIE1ofIy4vaIRLA=="), function (c) { return c.charCodeAt(0); }), REMEMBER = "tc-preview-BhziGhvG";
  function derive(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (k) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 310000, hash: "SHA-256" }, k,
        { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  function enter(key) {
    return fetch("s/seite.bin", { cache: "no-store" }).then(function (r) { return r.arrayBuffer(); }).then(function (b) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(b, 0, 12) }, key, new Uint8Array(b, 12));
    }).then(function (page) {
      window.__tcKey = key;
      document.open(); document.write(new TextDecoder().decode(page)); document.close();
    });
  }
  function remembered() {
    try { var raw = localStorage.getItem(REMEMBER); if (!raw) return null;
      return crypto.subtle.importKey("raw", Uint8Array.from(atob(raw), function (c) { return c.charCodeAt(0); }), "AES-GCM", true, ["decrypt"]);
    } catch (e) { return null; }
  }
  var r = remembered();
  if (r) r.then(enter).catch(function () { try { localStorage.removeItem(REMEMBER); } catch (e) {} });
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var b = document.getElementById("b"), m = document.getElementById("m");
    b.disabled = true; m.textContent = "";
    derive(document.getElementById("p").value).then(function (key) {
      return enter(key).then(function () {
        crypto.subtle.exportKey("raw", key).then(function (raw) {
          try { localStorage.setItem(REMEMBER, btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch (e) {}
        });
      });
    }).catch(function () { b.disabled = false; m.textContent = "Das Passwort stimmt nicht."; });
  });
})();
</script>
</body>
</html>
