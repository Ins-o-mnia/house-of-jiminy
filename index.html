<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Jiminy</title>
<meta name="description" content="Studio Jiminy: small worlds, with a song in them.">
<link rel="preload" href="/fonts/fraunces-italic-900-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Layout: one full-bleed WebGL field with the word inside the shader; four quiet corners frame it. */
:root {
  --night: #05071c;
  --ultramarine: #2335c9;
  --coral: #ff5a3c;
  --paper: #f6efe9;
  --ink: rgba(246, 239, 233, .94);
  --ink-dim: rgba(246, 239, 233, .66);
  --glass: rgba(5, 7, 28, .26);
  --glass-line: rgba(246, 239, 233, .24);
  --script: "Sour Gummy", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --mono: "Fragment Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
/* Frost is a light look: the frame switches to dark ink. */
:root.tone-light {
  --ink: rgba(12, 14, 44, .9); --ink-dim: rgba(12, 14, 44, .62);
  --glass: rgba(255, 255, 255, .42); --glass-line: rgba(12, 14, 44, .16);
  --paper: #0c0e2c; --night: #f4f3f8;
}
.tone-light .frame { text-shadow: none; }
.label, .tagline, .cta, .sound, .looks button { transition: color .4s, background .4s, border-color .4s; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); }
#field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.frame {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-top: calc(env(safe-area-inset-top, 0px) + clamp(16px, 3vh, 32px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(16px, 3vh, 32px));
  padding-left: max(clamp(16px, 3vw, 44px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, 3vw, 44px), env(safe-area-inset-right, 0px));
  pointer-events: none;
  text-shadow: 0 1px 14px rgba(5, 7, 28, .45);
}
.row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; }
.row.top { align-items: flex-start; }
.looks {
  display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
}
.looks button {
  font: inherit; font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-dim); background: transparent; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer;
  transition: color .3s, background .3s;
}
.looks button:hover { color: var(--ink); }
.looks button[aria-pressed="true"] { background: var(--paper); color: var(--night); text-shadow: none; }
.no-gl .looks { display: none; }
.row.top .label { flex: 1 1 0; }
.side { display: grid; gap: 14px; justify-items: end; min-width: 0; max-width: 100%; }
.looks { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.looks::-webkit-scrollbar { display: none; }
.looks button { flex-shrink: 0; }
.row > * { pointer-events: auto; min-width: 0; }

.label { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); line-height: 1.6; }
.label b { font-weight: 400; color: var(--ink); }
.label .by { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
.label .by:hover { color: var(--ink); border-bottom-color: currentColor; }

.sound {
  flex-shrink: 0; white-space: nowrap;
  font: inherit; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink); background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px;
  padding: 9px 14px 9px 12px; display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
  transition: background .3s, border-color .3s;
}
.sound:hover { background: rgba(246, 239, 233, .1); border-color: rgba(246, 239, 233, .45); }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
.bars i { width: 2px; height: 3px; background: currentColor; border-radius: 1px; transition: height .2s; }
.sound[aria-pressed="true"] .bars i { animation: bar .55s ease-in-out infinite alternate; }
.sound[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: .12s; }
.sound[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: .24s; }
@keyframes bar { from { height: 3px; } to { height: 10px; } }
/* Until the first click the button breathes softly and a small hint says how to hear it. */
.sound { position: relative; }
.sound .hint {
  position: absolute; top: calc(100% + 10px); right: 2px; white-space: nowrap;
  font-size: 10px; letter-spacing: .16em; color: var(--ink-dim);
  opacity: 0; transition: opacity .6s; pointer-events: none;
}
.sound.waiting .hint { opacity: 1; transition-delay: 1.2s; }
.sound.waiting { animation: wait-song 1.25s ease-in-out infinite; }
@keyframes wait-song {
  0%, 30%, 100% { border-color: var(--glass-line); box-shadow: 0 0 0 0 rgba(246, 239, 233, 0); }
  8%, 22% { border-color: rgba(246, 239, 233, .7); box-shadow: 0 0 18px 0 rgba(246, 239, 233, .18); }
}
@media (prefers-reduced-motion: reduce) { .sound.waiting { animation: none; } }

.lede { display: grid; gap: 16px; justify-items: start; }
.tagline {
  margin: 0; font-family: var(--serif); font-style: italic; font-weight: 400;
  font-size: clamp(19px, 2.1vw, 26px); line-height: 1.18; max-width: 20ch; text-wrap: balance; color: var(--ink);
}
.cta {
  display: inline-flex; align-items: baseline; gap: 14px;
  padding: 11px 18px 12px 16px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-line); color: var(--paper); text-decoration: none;
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  transition: background .3s, border-color .3s;
}
.cta .kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }
.cta .name { font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1; }
.cta .arrow { width: 26px; height: 26px; align-self: center; margin: -4px -4px -4px 2px; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.cta:hover { background: rgba(246, 239, 233, .12); border-color: rgba(246, 239, 233, .5); }
.cta:hover .arrow { transform: translate(3px, -3px) scale(1.06); }
.cta .soon { display: none; }
.cta.is-soon .soon { display: inline; }
.cta.is-soon .arrow { display: none; }

.readout { text-align: right; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }

.studio {
  /* "Studio", still and small above the moving word; its height is set from the word's measured top. */
  position: fixed; left: 0; right: 0; top: 30%; transform: translateY(calc(-100% - 2.6vh));
  text-align: center; pointer-events: none;
  font-family: var(--mono); font-size: clamp(12px, 1.35vw, 18px); letter-spacing: .55em; text-indent: .55em;
  text-transform: uppercase; color: var(--ink); text-shadow: 0 1px 14px rgba(5, 7, 28, .45);
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Without WebGL the word still stands, set in the same hand over a still gradient. */
.still { display: none; }
.no-gl #field { display: none; }
.no-gl .still {
  position: fixed; inset: 0; display: grid; place-items: center;
  background:
    radial-gradient(60% 70% at 50% 100%, rgba(255, 90, 60, .85), transparent 70%),
    radial-gradient(70% 60% at 20% 10%, rgba(35, 53, 201, .9), transparent 70%),
    var(--night);
  font-family: var(--script); font-weight: 900; font-size: min(26vw, 50vh); color: var(--paper);
  text-shadow: 0 0 40px rgba(255, 140, 90, .6);
}

@media (max-width: 560px) {
  .side { justify-items: start; width: 100%; }
  .looks:not(.types) { order: 3; width: 100%; }
  .looks button { padding: 7px 8px; }
  .readout { text-align: left; }
  .row.bottom { align-items: flex-start; }
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="studio" id="studio" aria-hidden="true">Studio</div>
<div class="still" aria-hidden="true">JIMINY</div>

<main class="frame">
  <h1 class="sr-only">Studio Jiminy</h1>
  <div class="row top">
    <div class="label"><b>Studio Jiminy</b><br>Est.&nbsp;2026<br><a class="by" href="https://paulsvoboda.de" target="_blank" rel="noopener">by&nbsp;Paul&nbsp;Svoboda&nbsp;↗</a></div>
    <button class="sound waiting" id="sound" type="button" aria-pressed="true">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="sound-label">Sound on</span>
      <span class="hint" aria-hidden="true">Tap anywhere for sound</span>
    </button>
  </div>
  <div class="row bottom">
    <div class="lede">
      <p class="tagline">Small worlds, with a song in them.</p>
      <a class="cta" id="cta" href="#" target="_blank" rel="noopener">
        <span class="kicker">First project</span>
        <span class="name">Tiny Dynasties</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 18.5 18.5 5.5M9 5.5h9.5V15" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="kicker soon">Soon</span>
      </a>
    </div>
    <div class="side">
    <div class="label readout" aria-live="off">
      <span id="songs">listening</span><br>
      <span>a robin, first light</span>
    </div>
    </div>
  </div>
</main>

<script>
(() => {
  // Where the button leads: the Tiny Dynasties preview behind a password (until it has an Impressum).
  const TINY_DYNASTIES_URL = '/tiny-dynasties/';
  const WORD = 'JIMINY';
  // Faces for the word, to try side by side. The first one opens.
  const TYPES = [
    { id: 'fraunces', css: 'italic 900 {size}px "Fraunces", Georgia, serif' },
    { id: 'instrument', css: 'italic 400 {size}px "Instrument Serif", Georgia, serif' },
    { id: 'syne', css: '800 {size}px "Syne", system-ui, sans-serif' },
    { id: 'unbounded', css: '900 {size}px "Unbounded", system-ui, sans-serif' },
    { id: 'bricolage', css: '800 {size}px "Bricolage Grotesque", system-ui, sans-serif' },
    { id: 'gummy', css: '900 {size}px "Sour Gummy", ui-rounded, system-ui, sans-serif' },
  ];
  let type = TYPES[0];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  setupLink();
  const sound = setupSound();
  // The looks, in shader order. The page opens on the one named in the link (#beam, #drift, #rings, #glass, #prism, #tiles, #frost).
  const LOOKS = ['glass', 'beam', 'drift', 'rings', 'prism', 'tiles', 'frost'];
  const look = { mode: 1, next: -1, fade: 1 };
  setupLooks();

  const canvas = document.getElementById('field');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) { document.documentElement.classList.add('no-gl'); return; }

  const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const FS = `
precision highp float;
uniform vec2 uRes;
uniform float uTime, uChirp, uSince, uLoop, uMouseOn, uBoil, uMode, uFade;
uniform vec2 uMouse, uWave;
uniform vec2 uTrail[8];
uniform sampler2D uText;

float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p), u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y);
}
float fbm(vec2 p){
  float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){ v+=a*noise(p); p=m*p+3.1; a*=.5; }
  return v;
}
// night -> ultramarine -> ice blue -> blush -> coral -> marigold
vec3 ramp(float x){
  x=clamp(x,0.,1.)*5.;
  vec3 c=mix(vec3(.015,.02,.09), vec3(.08,.12,.62), clamp(x,0.,1.));
  c=mix(c, vec3(.16,.55,.96), clamp(x-1.,0.,1.));
  c=mix(c, vec3(.96,.76,.84), clamp(x-2.,0.,1.));
  c=mix(c, vec3(1.,.36,.24), clamp(x-3.,0.,1.));
  c=mix(c, vec3(1.,.62,.2), clamp(x-4.,0.,1.));
  return c;
}
// ink black -> deep sea -> ocean -> ice -> blush -> coral, a little quieter than the glass ramp
vec3 seaRamp(float h){
  h=clamp(h,0.,1.)*5.;
  vec3 c=mix(vec3(.004,.008,.03), vec3(.02,.08,.28), clamp(h,0.,1.));
  c=mix(c, vec3(.05,.38,.66), clamp(h-1.,0.,1.));
  c=mix(c, vec3(.52,.78,.86), clamp(h-2.,0.,1.));
  c=mix(c, vec3(.9,.72,.74), clamp(h-3.,0.,1.));
  c=mix(c, vec3(.93,.34,.3), clamp(h-4.,0.,1.));
  return c;
}
// One fine line every ~5 pixels, whatever the screen.
float lines(float d){ return sin(d*uRes.y*1.25); }

// Fine dust: one soft point per grid cell (cell in pixels), the grid drifting at vel cells a second.
float dust(vec2 fc, vec2 vel, float cell, float dens, float seed){
  vec2 q=fc/cell-vel*uTime;
  vec2 id=floor(q), f=fract(q);
  float h=hash(id+seed);
  if(h>dens) return 0.;
  vec2 pos=vec2(hash(id+seed+1.3), hash(id+seed+7.1))*.6+.2;
  float d=length(f-pos)*cell;
  float tw=.55+.45*sin(uTime*(1.+3.*h)+h*40.);
  return smoothstep(1.5,.2,d)*tw;
}
// Pixel blocks: whole cells light up and blink, each column at its own speed.
float pixels(vec2 fc, float cell, float speed, float dens, float seed){
  float c=floor(fc.x/cell);
  float sp=speed*(.4+hash(vec2(c,seed)));
  vec2 id=floor(vec2(fc.x/cell, fc.y/cell-sp*uTime));
  float h=hash(id+seed);
  return step(1.-dens,h)*step(.3,fract(h*13.+uTime*(.25+h)));
}
// How close p is to the pointer or the tail it drags behind it.
float trailMask(vec2 p, float tight){
  float m=0.;
  for(int i=0;i<8;i++){
    float fi=float(i);
    vec2 d=p-uTrail[i];
    m=max(m, exp(-dot(d,d)*mix(38.,12.,fi/7.)*tight)*(1.-fi/9.));
  }
  return m*uMouseOn;
}
vec2 ringCenter(float t, float L){ return vec2(.22*sin(L)+.05*sin(t*.2), -.66+.05*sin(t*.13)); }

// paper fog -> lilac -> ultramarine -> coral -> marigold, for the light glass
vec3 frostRamp(float x){
  x=clamp(x,0.,1.)*4.;
  vec3 c=mix(vec3(.94,.94,.97), vec3(.8,.79,.95), clamp(x,0.,1.));
  c=mix(c, vec3(.24,.32,.92), clamp(x-1.,0.,1.));
  c=mix(c, vec3(1.,.45,.33), clamp(x-2.,0.,1.));
  c=mix(c, vec3(1.,.64,.3), clamp(x-3.,0.,1.));
  return c;
}

// Glass over a boiling field, in four cuts: g 0 reeds, 1 prism (slanted reeds that split the light),
// 2 tiles (square glass blocks), 3 frost (pale fog, fine reeds).
vec3 glass(vec2 p, float t, float L, float wave, float rr, float g, out vec2 refr, out float column){
  float isPrism=1.-step(.5,abs(g-1.)), isTiles=1.-step(.5,abs(g-2.)), isFrost=1.-step(.5,abs(g-3.));
  vec2 dm=p-uMouse;
  float near=exp(-dot(dm,dm)*7.)*uMouseOn;
  float k=.016+.016*uChirp+.05*wave+.05*near;
  float bend=.05*sin(p.y*2.3+t*.17)+.03*sin(p.y*5.1-t*.23+L);
  float f, edge;
  if(isTiles>.5){
    vec2 cell=(p+vec2(t*.012,-t*.008)+.01*wave*sin(rr*30.))*13.;
    vec2 fv=fract(cell)-.5;
    f=fv.x;
    edge=max(abs(fv.x),abs(fv.y));
    refr=fv*k*1.8*(1.+.4*hash(floor(cell)));
  } else {
    float a=isPrism*(.55+.12*sin(t*.07+L));
    vec2 pr=vec2(cos(a)*p.x-sin(a)*p.y, sin(a)*p.x+cos(a)*p.y);
    float n=mix(38.,mix(28.,64.,isFrost),max(isPrism,isFrost));
    float rx=(pr.x+bend*(1.-.4*isPrism)+.012*wave*sin(rr*40.))*n;
    f=fract(rx)-.5;
    edge=abs(f);
    float kk=k*mix(1.,mix(1.5,.7,isFrost),max(isPrism,isFrost));
    vec2 o=vec2(f*kk, -f*f*kk*.6);
    refr=vec2(cos(a)*o.x+sin(a)*o.y, -sin(a)*o.x+cos(a)*o.y);
  }
  vec2 q=p+refr;
  float T=t*.045;
  vec2 fp=q*1.15;
  vec2 w=vec2(fbm(fp*1.2+vec2(T,-T*.6)), fbm(fp*1.2+vec2(-T*.7,T)+5.2));
  float field=fbm(fp*.85+1.9*w+vec2(.3*sin(L),-t*.025));
  column=exp(-pow(q.x*1.6+.15*sin(q.y*2.+t*.2),2.))*smoothstep(.75,-.55,q.y);
  float x=field*1.05-.2+column*.5-q.y*.42+.16*sin(L+q.x*.8)+.05*uChirp;
  vec3 col;
  if(isFrost>.5){
    col=frostRamp(x*.85-.32+.25*column);
    col*=.97+.05*(1.-edge*2.);
    col+=vec3(1.)*.06*smoothstep(.38,.5,f);
    return col;
  }
  if(isPrism>.5){
    float sp=.14*f+.03*uChirp*f;
    col=vec3(ramp(x+sp).r, ramp(x).g, ramp(x-sp).b);
  } else col=ramp(x);
  if(isTiles>.5) col*=.92+.16*hash(floor((p+vec2(t*.012,-t*.008))*13.));
  float vio=smoothstep(.5,.78,fbm(fp*1.7+w*1.3+9.));
  col=mix(col, vec3(.52,.22,.92), vio*.38);
  col*=.9+.12*(1.-edge*2.);
  col+=vec3(.9,.95,1.)*.05*smoothstep(.38,.5,mix(f,edge,isTiles))*(.5+column)*(1.+isTiles*1.5);
  return col;
}

// 1 Beam: a column of light rising out of the dark, behind fine vertical grooves.
vec3 beam(vec2 p, float asp, float t, float L, out vec2 refr){
  float sway=.07*sin(p.y*1.6+t*.25)+.06*sin(t*.17+L);
  float s=lines(p.x+sway*.25+t*.0015);
  refr=vec2(s*.0032*(1.+uChirp),0.);
  vec2 q=p+refr;
  float yb=.5-q.y;
  // On a narrow screen the beam narrows with it.
  float xs=.45+.55*min(asp,1.);
  float x=(q.x+sway)/xs;
  float wdt=(.09+.3*yb*yb+.025*uChirp+.015*sin(L)+.04*sin(t*.3))*(.5+.5*min(asp,1.));
  float core=exp(-pow(x/wdt,2.));
  float side=exp(-pow((abs(x)-(.4+.07*sin(t*.23))*min(asp,1.5)/xs)/(.1+.12*yb),2.));
  float rise=smoothstep(-.1,1.,yb);
  float h=core*(.3+.8*rise)+side*(.18+.42*rise)+rise*.1;
  h*=.9+.18*uChirp;
  vec3 col=seaRamp(h);
  float mid=smoothstep(.12,.4,h)*smoothstep(1.05,.55,h);
  return col*(1.+.11*s*mid);
}

// 2 Drift: a dark diagonal current between cold and warm light, fine arcs fanned over it.
vec3 drift(vec2 p, float asp, float t, float L, out vec2 refr){
  vec2 c1=vec2(1.25*asp,-1.15), c2=vec2(-1.1*asp,1.25);
  float d1=length(p-c1), d2=length(p-c2);
  float s1=lines(d1+t*.002), s2=lines(d2-t*.0016);
  float m1=smoothstep(-.35,.45,p.x-p.y*.8), m2=1.-smoothstep(-.6,.1,p.x-p.y*.8);
  vec2 off=normalize(p-c1)*s1*m1*.0034+normalize(p-c2)*s2*m2*.0034;
  off*=1.+uChirp;
  refr=off;
  vec2 q=p+off;
  float a=.4+.18*sin(L)+.06*sin(t*.09);
  vec2 dir=normalize(vec2(sin(a),cos(a)));
  vec2 nrm=vec2(dir.y,-dir.x);
  float u=dot(q,nrm)-.05-.16*sin(t*.11);
  float v=dot(q,dir);
  vec3 cool=mix(vec3(.05,.24,.6), vec3(.42,.8,.93), smoothstep(-.15,-.7,u)*.85+.12*sin(v*2.+t*.1));
  vec2 pk=q-vec2(-.22*asp+.12*sin(t*.13),.36+.08*cos(t*.1));
  cool=mix(cool, vec3(.97,.82,.7), .55*exp(-dot(pk,pk)*7.));
  vec3 warm=mix(vec3(.93,.45,.18), vec3(.95,.58,.56), smoothstep(.1,-.55,v));
  warm=mix(vec3(.62,.1,.14), warm, smoothstep(.04,.38,u));
  warm=mix(warm, vec3(.45,.82,.95), .6*exp(-dot(q-vec2(.5*asp,.12),q-vec2(.5*asp,.12))*6.));
  vec3 col=mix(cool, warm, smoothstep(-.06,.22,u));
  col=mix(col, vec3(.01,.025,.1), .92*exp(-pow(u/.17,2.)));
  col=mix(col, vec3(.01,.025,.1), .55*smoothstep(-.1,-.9,u+v*.45));

  function setupLink() {
    const cta = document.getElementById('cta');
    if (TINY_DYNASTIES_URL && TINY_DYNASTIES_URL !== '#') { cta.href = TINY_DYNASTIES_URL; return; }
    let timer = 0;
    cta.addEventListener('click', e => {
      e.preventDefault();
      cta.classList.add('is-soon');
      clearTimeout(timer);
      timer = setTimeout(() => cta.classList.remove('is-soon'), 1800);
    });
  }

  // A robin's phrase, made up fresh each time: a clear whistle or two, a pearly trill that falls, a short warble.
  // Each note: start (s), length (s), pitch at start and end (Hz).
  function robinPhrase() {
    const r = (a, b) => a + Math.random() * (b - a);
    const out = [];
    let at = 0;
    for (let i = 0, n = 1 + Math.floor(r(0, 2)); i < n; i++) {
      const f = r(3800, 6800), dur = r(.1, .26);
      out.push({ at, dur, f0: f, f1: f * r(.85, 1.15) });
      at += dur + r(.06, .14);
    }
    let f = r(6200, 7800);
    const fall = r(.9, .96);
    for (let i = 0, n = 5 + Math.floor(r(0, 6)); i < n; i++) {
      const dur = r(.028, .045);
      out.push({ at, dur, f0: f * 1.12, f1: f * .88 });
      at += dur + r(.018, .03);
      f = Math.max(3200, f * fall);
    }
    at += r(.05, .12);
    for (let i = 0, n = Math.floor(r(1, 4)); i < n; i++) {
      const f = r(2200, 5200), dur = r(.06, .16);
      out.push({ at, dur, f0: f, f1: f * r(.75, 1.3), wob: r(20, 40) });
      at += dur + r(.04, .08);
    }
    return out;
  }

  // The robin's voice, synthesised, only after the visitor asks for it.
  function setupSound() {
    // Sound is on by default. Browsers only allow audio after the visitor interacts with the page, so the robin
    // starts with the first click, tap or key press anywhere; the button turns it off and on again.
    const btn = document.getElementById('sound'), label = document.getElementById('sound-label');
    let ac = null, master = null, on = true;
    const wake = () => {
      try {
        if (!ac) {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain();
          master.gain.value = .045;
          const lp = ac.createBiquadFilter();
          lp.type = 'lowpass'; lp.frequency.value = 9000;
          master.connect(lp).connect(ac.destination);
        }
        if (on) ac.resume(); else ac.suspend();
      } catch (err) { on = false; }
    };
    // A tap anywhere on the page (not on a link or button) switches the sound: the first one starts it, each
    // further one turns it off or on again. The button does the same.
    let started = false;
    const setOn = v => {
      on = v;
      if (!started) { started = true; btn.classList.remove('waiting'); }
      wake();
      btn.setAttribute('aria-pressed', String(on));
      label.textContent = on ? 'Sound on' : 'Sound off';
    };
    addEventListener('pointerdown', e => {
      if (e.target.closest && e.target.closest('a, button')) return;
      setOn(started ? !on : true);
    }, true);
    addEventListener('keydown', () => { if (!started) setOn(true); }, true);
    // The button simply flips the state it shows, so "Sound on" clicked before anything else means off.
    btn.addEventListener('click', () => setOn(!on));
    return {
      sing(phrase) {
        if (!on || !ac || ac.state !== 'running') return;
        const t0 = ac.currentTime + .02;
        for (const n of phrase) {
          const s = t0 + n.at, e = s + n.dur;
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(n.f0, s);
          o.frequency.exponentialRampToValueAtTime(n.f1, e);
          if (n.wob) {
            const lfo = ac.createOscillator(), depth = ac.createGain();
            lfo.frequency.value = n.wob; depth.gain.value = n.f0 * .04;
            lfo.connect(depth).connect(o.frequency);
            lfo.start(s); lfo.stop(e + .02);
          }
          g.gain.setValueAtTime(0, s);
          g.gain.linearRampToValueAtTime(.7, s + Math.min(.012, n.dur * .3));
          g.gain.setValueAtTime(.7, Math.max(s + .012, e - n.dur * .4));
          g.gain.exponentialRampToValueAtTime(.001, e);
          o.connect(g).connect(master);
          o.start(s);
          o.stop(e + .02);
        }
      }
    };
  }
})();
</script>
